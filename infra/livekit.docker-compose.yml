# T1 cheap infra: 1 Hetzner VPS runs LiveKit + Redis. Supabase hosts DB/auth. R2 holds videos.
# Usage: docker compose -f infra/livekit.docker-compose.yml up -d  (on the $5.50/mo server)
services:
  livekit:
    image: livekit/livekit-server:v1.8
    command: --dev # replace with /etc/livekit.yaml + real keys in staging/prod
    ports: ["7880:7880", "7881:7881/tcp", "7882:7882/udp"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
volumes:
  redis-data:
