name: ci
"on":
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'EOF'
          import json, re, sys
          t = json.load(open('design/tokens.json'))
          assert t['version'], 'tokens.json needs a version'
          hexes = set(re.findall(r'#[0-9A-Fa-f]{6}', open('packages/tokens/app_tokens.dart').read()))
          print('token colors ok:', sorted(hexes))
          EOF

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter analyze
        working-directory: apps/mobile

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
      - run: deno check services/api/functions/consent-ticket/index.ts services/api/functions/blocks/index.ts services/api/functions/user-search/index.ts services/api/functions/calls/index.ts services/api/functions/recording-withdraw/index.ts services/api/functions/recording-extension/index.ts services/api/functions/playback-url/index.ts services/api/functions/retention-sweep/index.ts services/api/functions/notify/index.ts

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in services/api/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -f "$f"
          done

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: callguard-windows
          path: apps/mobile/build/windows/x64/runner/Release

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build apk --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: callguard-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build web --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: callguard-web-pwa
          path: apps/mobile/build/web

  # Publishes the built PWA to the `netlify-publish` branch. Netlify watches that
  # branch and serves it at the public URL — no secrets needed, no other jobs affected.
  deploy-web-netlify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build web --release
        working-directory: apps/mobile
      - name: Publish build/web to netlify-publish branch
        run: |
          # Copy the build out to /tmp BEFORE cleaning the worktree (build lives in apps/mobile/build).
          rm -rf /tmp/pwa && mkdir -p /tmp/pwa
          cp -r apps/mobile/build/web/. /tmp/pwa/
          git config user.name "callguard-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan netlify-publish
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +
          cp -r /tmp/pwa/. .
          git add -A
          git commit -m "web pwa build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin netlify-publish
