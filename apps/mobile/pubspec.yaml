name: callguard
description: CallGuard MVP app shell (T1 blueprint, no real call yet).
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  supabase_flutter: ^2.5.0
  livekit_client: ^2.0.0
  # firebase_messaging removed: its Windows C++ SDK breaks `flutter build windows`
  # (CMake <3.5 removed). Push arrives in Stage F env via FCM/APNs natively, not this plugin.
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
