# Lives in apps/mobile/web so it ships at the root of build/web (Netlify publish root).
# Keeps APK/EXE builds untouched — this file only affects the web/PWA deploy.
[build]
  publish = "."

# go_router uses history routes (/settings/privacy, /call/demo) — serve them from index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must never be cached, or updates stop arriving.
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
